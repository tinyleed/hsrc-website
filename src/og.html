<!doctype html>
<html lang="da"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Figtree:wght@400;500&family=JetBrains+Mono:wght@500&display=block">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#f6f7fb;color:#1d1d1b;display:grid;grid-template-rows:1fr 112px;font-family:Figtree,sans-serif}
.top{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:24px;align-items:center;padding:0 56px 0 72px}
.eyebrow{display:flex;align-items:center;gap:12px;font:500 22px/1 "JetBrains Mono",monospace;letter-spacing:.12em;color:#24388d}
.eyebrow::before{content:"";width:12px;height:12px;border-radius:50%;background:#f39f22}
h1{margin-top:28px;font:800 80px/1.04 Outfit,sans-serif;letter-spacing:-.01em}
.ring{position:relative;display:inline-block;color:#24388d;white-space:nowrap}
.ring::after{content:"";position:absolute;inset:-.06em -.22em -.02em;border:.07em solid #f39f22;border-radius:50%;transform:rotate(-7deg)}
.sub{margin-top:30px;font:500 32px/1.3 Figtree,sans-serif;color:#575c72}
.en{margin-top:6px;font:400 26px/1.3 Figtree,sans-serif;color:#575c72}
.mascot{width:410px;height:auto;transform:rotate(-3deg)}
.band{display:flex;align-items:center;justify-content:center;gap:26px;background:#24388d;color:#fff;font:500 30px/1 "JetBrains Mono",monospace;letter-spacing:.04em}
.band i{width:10px;height:10px;border-radius:50%;background:#f39f22}
</style></head>
<body>
  <div class="top">
    <div>
      <p class="eyebrow">HERNING SOCIAL RUNNING CLUB</p>
      <h1>Løb sammen.<br><span class="ring">Snak bagefter.</span></h1>
      <p class="sub">Gratis · alle tempoer · mød bare op</p>
      <p class="en">Free social run · every pace · just turn up</p>
    </div>
    <img class="mascot" src="../assets/hsrc-mark.svg" alt="">
  </div>
  <div class="band"><span>ONSDAG 17.00</span><i></i><span>HERNING BIBLIOTEK</span><i></i><span>HSRC.DK</span></div>
</body></html>
